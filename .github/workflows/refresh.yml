name: Refresh FPL data

on:
  schedule:
    # Every 3 hours, as the baseline.
    - cron: "0 */3 * * *"
    # The nightly price change. FPL moves prices around 01:30 UK time, which is
    # 00:30 UTC under BST and 01:30 UTC under GMT — so this covers both, every
    # fifteen minutes. The API never says WHEN a price changed, so the only
    # timing we can honestly report is the window between two refreshes: this
    # is what turns "sometime in the last three hours" into a usable time.
    - cron: "*/15 0-2 * * *"
    # Weekend match windows, every 15 minutes. GitHub runs scheduled workflows
    # on a best-effort basis and often lags 5-15 minutes, so live points are
    # minutes old rather than seconds — the interface says which.
    - cron: "*/15 11-22 * * 6,0"
  workflow_dispatch: # lets you refresh on demand from the Actions tab
  push:
    branches: [main]
    paths:
      - "config.json"
      - "scripts/fetch.mjs"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch FPL data
        run: node scripts/fetch.mjs

      - name: Commit snapshot if it changed
        run: |
          git config user.name  "fpl-desk bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/details.json data/changes.json data/timeline.json data/prices.json
          if git diff --staged --quiet; then
            echo "No change in snapshot — nothing to commit."
          else
            git commit -m "Refresh FPL data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
